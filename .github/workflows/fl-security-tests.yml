name: FL Security Lab Tests

on:
  push:
    branches:
      - feature/fl-security-lab
      - refactor/remove-hydra
  workflow_dispatch:

concurrency:
  group: fl-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    if: "!contains(github.event.head_commit.message, '[cesnet-full]')"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -c constraints-py310.txt -e . "pytest>=7.3,<8"

      - name: Synthetic client and Flower smoke tests
        run: >
          python -m pytest -q -s
          eiffel/core/tests/synthetic_client_integration_test.py
          eiffel/core/tests/synthetic_flower_integration_test.py
          eiffel/core/tests/advanced_attacks_integration_test.py

      - name: Current TOML attack profiles E2E
        if: runner.os == 'Linux'
        run: >
          python -m pytest -q -s
          eiffel/core/tests/current_profiles_integration_test.py

      - name: Focused FL-security suite
        run: >
          python -m pytest -q
          eiffel/core/tests/client_test.py
          eiffel/core/tests/model_attacks_test.py
          eiffel/core/tests/aggregation_test.py
          eiffel/core/tests/defense_test.py
          eiffel/core/tests/label_flip_attack_test.py
          eiffel/core/tests/multiclass_models_test.py
          eiffel/core/tests/inference_capture_test.py
          eiffel/core/tests/round_store_test.py
          eiffel/core/tests/compare_metrics_test.py
          eiffel/core/tests/compact_round_analysis_test.py
          eiffel/core/tests/direct_runner_test.py
          eiffel/core/tests/synthetic_stress_test.py
          eiffel/core/tests/resource_allocation_test.py
          eiffel/core/tests/pool_client_selection_test.py
          eiffel/core/tests/campaign_runner_test.py
          eiffel/core/tests/client_heterogeneity_test.py
          eiffel/datasets/tests/dataset_test.py
          eiffel/datasets/tests/nfv2_test.py
          eiffel/datasets/tests/mirage_test.py
          eiffel/datasets/tests/preprocessed_network_test.py
          eiffel/datasets/tests/partitioners_test.py
          eiffel/datasets/tests/poisoning_test.py


  cesnet-fixture-smoke:
    if: contains(github.event.head_commit.message, '[cesnet-fixture]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -c constraints-py310.txt -e . "pytest>=7.3,<8"

      - name: Build deterministic CESNET-shaped fixture
        run: python scripts/create_cesnet_ci_fixture.py

      - name: Run CESNET fixture clean baseline
        run: >
          python -m eiffel.campaign_runner
          experiments/toml/cesnet_top50_clean.toml
          --output-root outputs/cesnet-fixture/clean
          --set experiment.rounds=30

      - name: Run CESNET fixture Sign Flip
        run: >
          python -m eiffel.campaign_runner
          experiments/toml/cesnet_top50_sign_flip.toml
          --output-root outputs/cesnet-fixture/sign-flip
          --set experiment.rounds=30

      - name: Validate persisted HDF5 runs
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r path; do
            found=1
            echo "Validating $path"
            python -m eiffel.analysis.validate_round_state "$path"
          done < <(find outputs/cesnet-fixture -name round_state.h5 -type f | sort)
          test "$found" -eq 1

      - name: Compare clean and Sign Flip
        run: >
          python -m eiffel.analysis.compare_metrics
          --runs-root outputs/cesnet-fixture
          --output-dir analysis-results/cesnet-fixture

      - name: Print final metrics
        shell: bash
        run: |
          echo "=== final_metrics.csv ==="
          cat analysis-results/cesnet-fixture/final_metrics.csv
          echo
          echo "=== delta_vs_clean.csv ==="
          cat analysis-results/cesnet-fixture/delta_vs_clean.csv || true

      - name: Upload CESNET fixture results
        uses: actions/upload-artifact@v4
        with:
          name: cesnet-fixture-30round-results
          path: |
            outputs/cesnet-fixture/**/round_state.h5
            outputs/cesnet-fixture/**/campaign_manifest.csv
            analysis-results/cesnet-fixture/**
          if-no-files-found: error
          retention-days: 14



  cesnet-fixture-full-run:
    if: contains(github.event.head_commit.message, '[cesnet-full]')
    strategy:
      fail-fast: false
      matrix:
        attack:
          - clean
          - label_flip_targeted
          - sign_flip
          - model_scaling
          - gaussian_noise
          - lie
          - gradient_mimicry
          - colluding_sign_flip
          - min_max
          - min_sum
          - adaptive_stealth
          - heterogeneity_aware_mimicry
          - targeted_family_poisoning
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -c constraints-py310.txt -e .

      - name: Build deterministic CESNET-shaped fixture
        run: python scripts/create_cesnet_ci_fixture.py

      - name: Run 30-round attack
        shell: bash
        run: |
          mkdir -p "outputs/cesnet-fixture-full/${{ matrix.attack }}"
          set +e
          python -m eiffel.campaign_runner             "experiments/toml/cesnet_top50_${{ matrix.attack }}.toml"             --output-root "outputs/cesnet-fixture-full/${{ matrix.attack }}"             --set experiment.rounds=30
          rc=$?
          set -e
          echo "attack,return_code" > "outputs/cesnet-fixture-full/${{ matrix.attack }}/status.csv"
          echo "${{ matrix.attack }},$rc" >> "outputs/cesnet-fixture-full/${{ matrix.attack }}/status.csv"
          exit "$rc"

      - name: Validate HDF5
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          path="$(find "outputs/cesnet-fixture-full/${{ matrix.attack }}" -name round_state.h5 -type f | head -n 1)"
          test -n "$path"
          python -m eiffel.analysis.validate_round_state "$path"

      - name: Analyze attack run
        if: success()
        run: >
          python -m eiffel.analysis.compare_metrics
          --runs-root "outputs/cesnet-fixture-full/${{ matrix.attack }}"
          --output-dir "analysis-results/cesnet-fixture-full/${{ matrix.attack }}"

      - name: Upload attack summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cesnet-fixture-full-${{ matrix.attack }}
          path: |
            outputs/cesnet-fixture-full/${{ matrix.attack }}/status.csv
            outputs/cesnet-fixture-full/${{ matrix.attack }}/campaign_manifest.csv
            analysis-results/cesnet-fixture-full/${{ matrix.attack }}/round_metrics.csv
            analysis-results/cesnet-fixture-full/${{ matrix.attack }}/final_metrics.csv
            analysis-results/cesnet-fixture-full/${{ matrix.attack }}/per_family_metrics.csv
          if-no-files-found: warn
          retention-days: 14

  cesnet-fixture-full-summary:
    if: always() && contains(github.event.head_commit.message, '[cesnet-full]')
    needs: cesnet-fixture-full-run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install summary dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -c constraints-py310.txt "numpy==1.23.5" "pandas<2.1"

      - uses: actions/download-artifact@v4
        with:
          pattern: cesnet-fixture-full-*
          path: collected

      - name: Aggregate attack results
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import numpy as np

          root = Path("collected")
          out = Path("cesnet-fixture-full-summary")
          out.mkdir(parents=True, exist_ok=True)

          status_paths = list(root.rglob("status.csv"))
          statuses = pd.concat(
              [pd.read_csv(path) for path in status_paths],
              ignore_index=True,
          ) if status_paths else pd.DataFrame(columns=["attack", "return_code"])
          statuses = statuses.sort_values("attack")
          statuses.to_csv(out / "suite_status.csv", index=False)

          final_paths = list(root.rglob("final_metrics.csv"))
          finals = pd.concat(
              [pd.read_csv(path) for path in final_paths],
              ignore_index=True,
          ) if final_paths else pd.DataFrame()
          if not finals.empty:
              finals = finals.sort_values("attack")
              finals.to_csv(out / "final_metrics.csv", index=False)

              clean_rows = finals[finals["attack"] == "clean"]
              delta_rows = []
              if not clean_rows.empty:
                  metric_cols = [
                      col for col in finals.columns
                      if col not in {"attack", "run", "round"}
                  ]
                  for attack in sorted(set(finals["attack"]) - {"clean"}):
                      attack_row = finals[finals["attack"] == attack].iloc[0]
                      clean_row = clean_rows.iloc[0]
                      for metric in metric_cols:
                          try:
                              a = float(attack_row[metric])
                              b = float(clean_row[metric])
                          except (TypeError, ValueError):
                              continue
                          if np.isfinite(a) and np.isfinite(b):
                              delta_rows.append({
                                  "attack": attack,
                                  "metric": metric,
                                  "delta_vs_clean": a - b,
                              })
              pd.DataFrame(delta_rows).to_csv(
                  out / "delta_vs_clean.csv", index=False
              )

          family_paths = list(root.rglob("per_family_metrics.csv"))
          if family_paths:
              families = pd.concat(
                  [pd.read_csv(path) for path in family_paths],
                  ignore_index=True,
              )
              families.to_csv(out / "per_family_metrics.csv", index=False)
              recalls = families[families["metric"] == "recall"].copy()
              if not recalls.empty:
                  idx = recalls.groupby(
                      ["attack", "run", "family"]
                  )["round"].idxmax()
                  final_recall = recalls.loc[
                      idx, ["attack", "family", "value"]
                  ].copy()
                  final_recall.to_csv(
                      out / "final_class_recall.csv", index=False
                  )
                  summary = (
                      final_recall.groupby("attack")["value"]
                      .agg(
                          mean_class_recall="mean",
                          min_class_recall="min",
                          max_class_recall="max",
                          zero_recall_classes=lambda s: int((s <= 1e-12).sum()),
                      )
                      .reset_index()
                      .sort_values("attack")
                  )
                  summary.to_csv(
                      out / "class_recall_summary.csv", index=False
                  )

                  clean = final_recall[
                      final_recall["attack"] == "clean"
                  ][["family", "value"]].rename(
                      columns={"value": "clean_recall"}
                  )
                  attacked = final_recall[
                      final_recall["attack"] != "clean"
                  ].merge(clean, on="family", how="left")
                  attacked["recall_delta_vs_clean"] = (
                      attacked["value"] - attacked["clean_recall"]
                  )
                  attacked.sort_values(
                      ["attack", "recall_delta_vs_clean"]
                  ).to_csv(
                      out / "class_recall_delta_vs_clean.csv",
                      index=False,
                  )

          round_paths = list(root.rglob("round_metrics.csv"))
          if round_paths:
              rounds = pd.concat(
                  [pd.read_csv(path) for path in round_paths],
                  ignore_index=True,
              )
              rounds.sort_values(["attack", "round"]).to_csv(
                  out / "round_metrics.csv", index=False
              )

          print("=== suite_status.csv ===")
          print(statuses.to_string(index=False))
          if not finals.empty:
              cols = [
                  col for col in
                  ["attack", "round", "accuracy", "macro_f1", "mcc",
                   "macro_class_recall", "min_class_recall"]
                  if col in finals.columns
              ]
              print("\n=== final metrics ===")
              print(finals[cols].to_string(index=False))
          recall_summary = out / "class_recall_summary.csv"
          if recall_summary.exists():
              print("\n=== class recall summary ===")
              print(pd.read_csv(recall_summary).to_string(index=False))
          PY

      - name: Upload aggregated CESNET fixture results
        uses: actions/upload-artifact@v4
        with:
          name: cesnet-fixture-full-summary
          path: cesnet-fixture-full-summary/**
          if-no-files-found: error
          retention-days: 14

      - name: Assert all 13 attacks completed
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          expected = {
              "clean", "label_flip_targeted", "sign_flip", "model_scaling",
              "gaussian_noise", "lie", "gradient_mimicry",
              "colluding_sign_flip", "min_max", "min_sum",
              "adaptive_stealth", "heterogeneity_aware_mimicry",
              "targeted_family_poisoning",
          }
          status = pd.read_csv(
              Path("cesnet-fixture-full-summary") / "suite_status.csv"
          )
          observed = set(status["attack"])
          missing = expected - observed
          failed = status[status["return_code"] != 0]
          if missing or not failed.empty:
              raise SystemExit(
                  f"missing={sorted(missing)} failed={failed.to_dict('records')}"
              )
          print("All 13 CESNET fixture attacks completed successfully.")
          PY

  cesnet-noniid-full-run:
    if: contains(github.event.head_commit.message, '[cesnet-noniid]')
    strategy:
      fail-fast: false
      matrix:
        attack:
          - clean
          - label_flip_targeted
          - sign_flip
          - model_scaling
          - gaussian_noise
          - lie
          - gradient_mimicry
          - colluding_sign_flip
          - min_max
          - min_sum
          - adaptive_stealth
          - heterogeneity_aware_mimicry
          - targeted_family_poisoning
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -c constraints-py310.txt -e .

      - name: Build hard non-IID CESNET-shaped fixture
        run: python scripts/create_cesnet_noniid_ci_fixture.py

      - name: Run 30-round attack
        shell: bash
        run: |
          mkdir -p "outputs/cesnet-noniid/${{ matrix.attack }}"
          set +e
          python -m eiffel.campaign_runner \
            "experiments/toml/cesnet_top50_${{ matrix.attack }}.toml" \
            --output-root "outputs/cesnet-noniid/${{ matrix.attack }}" \
            --set experiment.rounds=30
          rc=$?
          set -e
          echo "attack,return_code" > "outputs/cesnet-noniid/${{ matrix.attack }}/status.csv"
          echo "${{ matrix.attack }},$rc" >> "outputs/cesnet-noniid/${{ matrix.attack }}/status.csv"
          exit "$rc"

      - name: Validate HDF5
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          path="$(find "outputs/cesnet-noniid/${{ matrix.attack }}" -name round_state.h5 -type f | head -n 1)"
          test -n "$path"
          python -m eiffel.analysis.validate_round_state "$path"

      - name: Analyze attack run
        if: success()
        run: >
          python -m eiffel.analysis.compare_metrics
          --runs-root "outputs/cesnet-noniid/${{ matrix.attack }}"
          --output-dir "analysis-results/cesnet-noniid/${{ matrix.attack }}"

      - name: Upload attack summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cesnet-noniid-${{ matrix.attack }}
          path: |
            outputs/cesnet-noniid/${{ matrix.attack }}/status.csv
            outputs/cesnet-noniid/${{ matrix.attack }}/campaign_manifest.csv
            analysis-results/cesnet-noniid/${{ matrix.attack }}/round_metrics.csv
            analysis-results/cesnet-noniid/${{ matrix.attack }}/final_metrics.csv
            analysis-results/cesnet-noniid/${{ matrix.attack }}/per_family_metrics.csv
            data/cesnet/manifest.json
            data/cesnet/class_distribution.csv
          if-no-files-found: warn
          retention-days: 14

  cesnet-noniid-summary:
    if: always() && contains(github.event.head_commit.message, '[cesnet-noniid]')
    needs: cesnet-noniid-full-run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cesnet-noniid-*
          path: collected

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install summary dependencies
        run: python -m pip install "numpy==1.23.5" "pandas<2.1"

      - name: Aggregate non-IID attack results
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd

          root = Path("collected")
          out = Path("cesnet-noniid-summary")
          out.mkdir(parents=True, exist_ok=True)

          status_paths = list(root.rglob("status.csv"))
          statuses = pd.concat(
              [pd.read_csv(path) for path in status_paths],
              ignore_index=True,
          ).sort_values("attack")
          statuses.to_csv(out / "suite_status.csv", index=False)

          final_paths = list(root.rglob("final_metrics.csv"))
          finals = pd.concat(
              [pd.read_csv(path) for path in final_paths],
              ignore_index=True,
          ) if final_paths else pd.DataFrame()
          if not finals.empty:
              finals = finals.sort_values("attack")
              finals.to_csv(out / "final_metrics.csv", index=False)

          family_paths = list(root.rglob("per_family_metrics.csv"))
          if family_paths:
              families = pd.concat(
                  [pd.read_csv(path) for path in family_paths],
                  ignore_index=True,
              )
              recalls = families[families["metric"] == "recall"].copy()
              idx = recalls.groupby(["attack", "family"])["round"].idxmax()
              final_recall = recalls.loc[
                  idx, ["attack", "family", "value"]
              ].copy()
              final_recall.to_csv(out / "final_class_recall.csv", index=False)

              clean = final_recall[final_recall["attack"] == "clean"][
                  ["family", "value"]
              ].rename(columns={"value": "clean_recall"})
              attacked = final_recall[
                  final_recall["attack"] != "clean"
              ].merge(clean, on="family", how="left")
              attacked["recall_delta_vs_clean"] = (
                  attacked["value"] - attacked["clean_recall"]
              )
              attacked.to_csv(
                  out / "class_recall_delta_vs_clean.csv", index=False
              )

              target = final_recall[
                  final_recall["family"] == "domain_00.example"
              ].sort_values("attack")
              target.to_csv(out / "target_class_recall.csv", index=False)

          if not finals.empty:
              clean_rows = finals[finals["attack"] == "clean"]
              delta_rows = []
              if not clean_rows.empty:
                  clean_row = clean_rows.iloc[0]
                  metric_cols = [
                      col for col in finals.columns
                      if col not in {"attack", "run", "round"}
                  ]
                  for _, row in finals[finals["attack"] != "clean"].iterrows():
                      for metric in metric_cols:
                          try:
                              a = float(row[metric]); b = float(clean_row[metric])
                          except (TypeError, ValueError):
                              continue
                          if np.isfinite(a) and np.isfinite(b):
                              delta_rows.append({
                                  "attack": row["attack"],
                                  "metric": metric,
                                  "delta_vs_clean": a - b,
                              })
              pd.DataFrame(delta_rows).to_csv(
                  out / "delta_vs_clean.csv", index=False
              )

          print("=== suite status ===")
          print(statuses.to_string(index=False))
          if not finals.empty:
              cols = [
                  x for x in [
                      "attack", "round", "accuracy", "macro_f1", "mcc",
                      "macro_class_recall", "min_class_recall"
                  ] if x in finals.columns
              ]
              print("\n=== final metrics ===")
              print(finals[cols].to_string(index=False))
          PY

      - name: Upload aggregated non-IID results
        uses: actions/upload-artifact@v4
        with:
          name: cesnet-noniid-summary
          path: cesnet-noniid-summary/**
          if-no-files-found: error
          retention-days: 14

      - name: Assert all attacks completed
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          status = pd.read_csv("cesnet-noniid-summary/suite_status.csv")
          expected = 13
          failed = status[status["return_code"] != 0]
          if len(status) != expected or not failed.empty:
              raise SystemExit(
                  f"expected={expected} observed={len(status)} "
                  f"failed={failed.to_dict('records')}"
              )
          print("All 13 hard non-IID CESNET fixture attacks completed.")
          PY

  cesnet-calibrated-clean:
    if: contains(github.event.head_commit.message, '[cesnet-calibrate]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -c constraints-py310.txt -e .

      - name: Build calibrated non-IID CESNET fixture
        run: python scripts/create_cesnet_calibrated_ci_fixture.py

      - name: Quantify calibrated client heterogeneity
        run: >
          python -m eiffel.analysis.client_heterogeneity
          data/cesnet/class_distribution.csv
          --output-dir analysis-results/cesnet-calibrated/heterogeneity
          --target-class 0
          --malicious-ids 0,1
      - name: Run 30-round clean baseline
        run: >
          python -m eiffel.campaign_runner
          experiments/toml/cesnet_top50_clean.toml
          --output-root outputs/cesnet-calibrated/clean
          --set experiment.rounds=30

      - name: Validate HDF5
        shell: bash
        run: |
          set -euo pipefail
          path="$(find outputs/cesnet-calibrated/clean -name round_state.h5 -type f | head -n 1)"
          test -n "$path"
          python -m eiffel.analysis.validate_round_state "$path"

      - name: Analyze clean baseline
        run: >
          python -m eiffel.analysis.compare_metrics
          --runs-root outputs/cesnet-calibrated/clean
          --output-dir analysis-results/cesnet-calibrated/clean

      - name: Assert baseline quality
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path("analysis-results/cesnet-calibrated/clean")
          final = pd.read_csv(root / "final_metrics.csv").iloc[0]
          families = pd.read_csv(root / "per_family_metrics.csv")
          recalls = families[families["metric"] == "recall"]
          final_round = recalls["round"].max()
          recalls = recalls[recalls["round"] == final_round]
          recall_map = dict(zip(recalls["family"], recalls["value"]))

          checks = {
              "accuracy>=0.80": float(final["accuracy"]) >= 0.80,
              "macro_f1>=0.75": float(final["macro_f1"]) >= 0.75,
              "min_class_recall>=0.40": float(final["min_class_recall"]) >= 0.40,
              "target0_recall>=0.75": recall_map.get("domain_00.example", 0.0) >= 0.75,
              "target1_recall>=0.50": recall_map.get("domain_01.example", 0.0) >= 0.50,
          }
          print("Final clean metrics:")
          print(final.to_string())
          print("\nLowest class recalls:")
          print(recalls.sort_values("value").head(10).to_string(index=False))
          print("\nChecks:", checks)
          if not all(checks.values()):
              raise SystemExit("Calibrated fixture clean baseline is not healthy enough.")
          PY

      - name: Upload calibrated clean result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cesnet-calibrated-clean
          path: |
            outputs/cesnet-calibrated/clean/campaign_manifest.csv
            analysis-results/cesnet-calibrated/clean/**
            data/cesnet/manifest.json
            analysis-results/cesnet-calibrated/heterogeneity/**
            data/cesnet/class_distribution.csv
          if-no-files-found: warn
          retention-days: 14
