name: Free cloud feasibility

on:
  push:
    branches:
      - codex/free-cloud-research-20261004
    paths:
      - .github/workflows/free-cloud-feasibility.yml
      - scripts/research/cloud_probe.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-cloud-feasibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-synthetic-clean:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the pinned research stack
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -c constraints-py310.txt -e .
          python -m pip check
      - name: Validate full synthetic clean, 30 rounds, 50000 training samples
        run: python scripts/research/cloud_probe.py
      # No artifact upload or dependency cache: no extra storage is reserved.
      # Numeric evidence is printed into the job log and summary.
