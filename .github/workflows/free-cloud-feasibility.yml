name: Free MIRAGE feasibility

on:
  push:
    branches:
      - codex/free-cloud-research-20261004
    paths:
      - .github/workflows/free-cloud-feasibility.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-cloud-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirage-input-check:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      MIRAGE_DATA_URL: ${{ secrets.EIFFEL_MIRAGE_URL }}
    steps:
      - name: Require the real preprocessed MIRAGE snapshot
        shell: bash
        run: |
          python3 - <<'DATA_CHECK'
          import os
          from urllib.parse import urlsplit
          value = os.environ.get('MIRAGE_DATA_URL', '').strip()
          if not value:
              raise SystemExit('MIRAGE real training not started: attach the preprocessed Parquet ZIP or supply EIFFEL_MIRAGE_URL. No synthetic substitute is permitted.')
          if urlsplit(value).scheme != 'https':
              raise SystemExit('MIRAGE real training not started: the download source must use HTTPS.')
          print('A MIRAGE download source is configured. Its contents and checksum must be validated before any training.')
          DATA_CHECK
      # No artifact uploads, cache reservations, larger runners or synthetic training.
