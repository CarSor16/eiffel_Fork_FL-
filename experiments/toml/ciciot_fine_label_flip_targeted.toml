# CICIoT2023 fine-grained 34-class experiment (30 rounds).

[experiment]
name = "ciciot-fine-label-flip-targeted"
seed = 2026
num_clients = 10
rounds = 30

[dataset]
name = "ciciot_fine"
task = "multiclass"
num_classes = 34

[partition]
type = "preassigned"

[model]
name = "p4p_mlp"
dropout = 0.2

[training]
local_epochs = 1
learning_rate = 0.001
batch_size = 512

[attack]
mechanism = "label_flip"
objective = "targeted"
malicious_fraction = 0.2
poison_rate = 1.0
# Fine classes are deterministic sorted IDs; class 0 -> class 1.
source_class = 0
destination_class = 1

[attack.schedule]
type = "continuous"

[aggregation]
name = "fedavg"

[storage]
enabled = true
path = "round_state.h5"
compression = "gzip"
compression_level = 4
flush_each_round = true
capture_inference = true
capture_logits = true
capture_probe_features = true
capture_global_inference = true
probe_size = 512
