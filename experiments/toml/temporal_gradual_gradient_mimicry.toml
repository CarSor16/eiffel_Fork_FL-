# Eiffel FL Security Lab TOML profile
# Adapted from the previous flower_attack_lab configuration style.
# Default dataset: sampled NF-V2 CSE-CIC-IDS2018 (binary NIDS).

[experiment]
name = "temporal-gradual-gradient-mimicry"
seed = 2026
num_clients = 10
rounds = 40

[dataset]
name = "cicids"

[partition]
type = "dirichlet"
dirichlet_alpha = 0.5

[model]
name = "popoola"

[training]
local_epochs = 1
learning_rate = 0.0001
batch_size = 512

[attack]
mechanism = "gradient_mimicry"
objective = "untargeted"
malicious_fraction = 0.1
mimicry_lambda = 0.85

[attack.schedule]
type = "gradual"
start_round = 10
end_round = 40
gradual_start_strength = 0.05
gradual_end_strength = 1.0

[aggregation]
name = "fedavg"

[storage]
enabled = true
path = "round_state.h5"
compression = "gzip"
compression_level = 4
flush_each_round = true
capture_inference = true
probe_size = 256
