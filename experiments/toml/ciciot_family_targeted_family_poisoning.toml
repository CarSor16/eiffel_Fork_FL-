# CICIoT2023 family-level multiclass experiment (30 rounds).

[experiment]
name = "ciciot-family-targeted-family-poisoning"
seed = 2026
num_clients = 10
rounds = 30

[dataset]
name = "ciciot_family"
task = "multiclass"
num_classes = 8

[partition]
type = "preassigned"

[model]
name = "p4p_mlp"
dropout = 0.2

[training]
local_epochs = 1
learning_rate = 0.001
batch_size = 512

[attack]
mechanism = "targeted_family_poisoning"
malicious_fraction = 0.2

[attack.targeted]
target_family = "DDoS"
target_amplification = 2.5
target_mimicry_lambda = 0.15

[attack.schedule]
type = "continuous"

[aggregation]
name = "fedavg"

[storage]
enabled = true
path = "round_state.h5"
compression = "gzip"
compression_level = 4
flush_each_round = true
capture_inference = true
capture_logits = true
capture_probe_features = true
capture_global_inference = true
probe_size = 512
