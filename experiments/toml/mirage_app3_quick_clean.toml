# MIRAGE-GenAI-2025 app classification smoke test.
# Uses the 10 preassigned non-IID logical clients generated by preprocessing.

[experiment]
name = "mirage-app3-quick-clean"
seed = 2026
num_clients = 10
rounds = 5

[dataset]
name = "mirage_app3"
task = "multiclass"
num_classes = 3

[partition]
type = "preassigned"

[model]
name = "p4p_mlp"
dropout = 0.2

[training]
local_epochs = 1
learning_rate = 0.001
batch_size = 128

[attack]
mechanism = "none"
objective = "untargeted"
malicious_fraction = 0.0

[aggregation]
name = "fedavg"

[storage]
enabled = true
path = "round_state.h5"
compression = "gzip"
compression_level = 4
flush_each_round = true
capture_inference = true
capture_logits = true
capture_probe_features = true
probe_size = 256
