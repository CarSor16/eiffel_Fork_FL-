# Full NF-V2 data-center profile.
# Dataset path is provided through the data-center Hydra group/environment variable.

[experiment]
name = "dc-cicids-adaptive-stealth"
seed = 2026
num_clients = 10
rounds = 30

[dataset]
name = "cicids_datacenter"
task = "family_aware"

[partition]
type = "dirichlet"
dirichlet_alpha = 0.5

[model]
name = "popoola"

[training]
local_epochs = 1
learning_rate = 0.0001
batch_size = 512

[attack]
mechanism = "adaptive_stealth"
malicious_fraction = 0.2

[attack.adaptive]
direction = "sign"
search_steps = 24
max_strength = 8.0
l2_quantile = 0.95
distance_quantile = 0.95
min_cosine_quantile = 0.05
stealth_margin = 1.0
cosine_slack = 0.02

[attack.schedule]
type = "continuous"

[aggregation]
name = "fedavg"

[storage]
enabled = true
path = "round_state.h5"
compression = "gzip"
compression_level = 4
flush_each_round = true
capture_inference = true
capture_logits = true
capture_probe_features = true
capture_global_inference = true
probe_size = 512
