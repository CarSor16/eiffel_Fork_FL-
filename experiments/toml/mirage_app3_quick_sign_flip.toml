# MIRAGE-GenAI-2025 app classification smoke test with Sign Flip.
# Pure model poisoning: local labels remain clean.

[experiment]
name = "mirage-app3-quick-sign-flip"
seed = 2026
num_clients = 10
rounds = 5

[dataset]
name = "mirage_app3"
task = "multiclass"
num_classes = 3

[partition]
type = "preassigned"

[model]
name = "p4p_mlp"
dropout = 0.2

[training]
local_epochs = 1
learning_rate = 0.001
batch_size = 128

[attack]
mechanism = "sign_flip"
objective = "untargeted"
malicious_fraction = 0.2
strength = 3.0

[attack.schedule]
type = "continuous"
start_round = 1

[aggregation]
name = "fedavg"

[storage]
enabled = true
path = "round_state.h5"
compression = "gzip"
compression_level = 4
flush_each_round = true
capture_inference = true
capture_logits = true
capture_probe_features = true
probe_size = 256
