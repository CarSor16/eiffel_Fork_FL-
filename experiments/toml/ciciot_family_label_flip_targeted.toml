# CICIoT2023 family-level multiclass experiment (30 rounds).

[experiment]
name = "ciciot-family-label-flip-targeted"
seed = 2026
num_clients = 10
rounds = 30

[dataset]
name = "ciciot_family"
task = "multiclass"
num_classes = 8

[partition]
type = "preassigned"

[model]
name = "p4p_mlp"
dropout = 0.2

[training]
local_epochs = 1
learning_rate = 0.001
batch_size = 512

[attack]
mechanism = "label_flip"
objective = "targeted"
malicious_fraction = 0.2
poison_rate = 1.0
# Family mapping from preprocessing: DDoS=1 -> DoS=2.
source_class = 1
destination_class = 2

[attack.schedule]
type = "continuous"

[aggregation]
name = "fedavg"

[storage]
enabled = true
path = "round_state.h5"
compression = "gzip"
compression_level = 4
flush_each_round = true
capture_inference = true
capture_logits = true
capture_probe_features = true
capture_global_inference = true
probe_size = 512
